<script>
// ============ 配置 ============
const ADMIN_PHONE = '19962801865';
// 云端 KV（jsonstore.io，支持 CORS，任意浏览器可直连）。可在链接后加 ?kv=你的token 覆盖。
const KV_TOKEN = 'pipisnack2026db8f3c2a1b3d4e6f9a0b1c2d3e4f5a6b';
const params = new URLSearchParams(location.search);
const KV_URL = 'https://www.jsonstore.io/' + (params.get('kv') || KV_TOKEN);

const $ = id => document.getElementById(id);
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',2400); }

// ============ 数据层（云端 KV + 本地兜底） ============
const DEFAULT_DB = {
  shopName: '皮皮家江西特色小吃',
  subtitle: '南昌拌粉 + 瓦罐汤',
  notice: '可送货上门，欢迎订购！',
  categories: [
    { name: '主食', items: [
      { name: '拌粉/面/空心粉', price: 10 },
      { name: '汤粉/面/空心粉', price: 12 },
      { name: '酸辣粉', price: 12 }
    ]},
    { name: '浇头', items: [
      { name: '红烧牛杂', price: 5 },
      { name: '鸡腿', price: 5 },
      { name: '荷包蛋', price: 2 },
      { name: '凉拌腐竹', price: 2 }
    ]},
    { name: '汤品', items: [
      { name: '海带排骨汤', price: 8 },
      { name: '玉米排骨汤', price: 8 },
      { name: '山药排骨汤', price: 8 },
      { name: '萝卜排骨汤', price: 8 },
      { name: '鸡蛋肉饼汤', price: 8 },
      { name: '皮蛋肉饼汤', price: 8 },
      { name: '鸡汤', price: 8 }
    ]}
  ],
  dates: [],
  times: ['11:00-11:30', '11:30-12:00', '12:00-12:30', '17:30-18:00', '18:00-18:30'],
  orders: []
};

let cloudOK = false;
async function loadDB(){
  try{
    const r = await fetch(KV_URL, { cache:'no-store' });
    if(r.ok){
      let j = await r.json();
      if(j && j.result!==undefined) j = j.result;      // jsonstore 包装兼容
      if(j && (Array.isArray(j.categories) || Array.isArray(j.orders))){
        cloudOK = true;
        localStorage.setItem('pp_db', JSON.stringify(j));
        setSync(true);
        return j;
      }
    }
  }catch(e){ /* 云端不可达，走本地 */ }
  cloudOK = false; setSync(false);
  const l = localStorage.getItem('pp_db');
  if(l){ try{ return JSON.parse(l); }catch(e){} }
  const d = JSON.parse(JSON.stringify(DEFAULT_DB));
  return d;
}
async function saveDB(db){
  localStorage.setItem('pp_db', JSON.stringify(db));
  try{
    await fetch(KV_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(db) });
    cloudOK = true; setSync(true);
  }catch(e){
    cloudOK = false; setSync(false);
    toast('⚠️ 云端同步失败，已存本地（本机可用）');
  }
}
function setSync(ok){
  const t = $('syncTag');
  if(!t) return;
  t.textContent = ok ? '☁ 云端已同步' : '💾 本地模式';
  t.className = 'sync-tag ' + (ok ? 'ok' : 'bad');
}

// ============ 全局状态 ============
let me = null;          // {phone, role}
let db = null;          // 完整数据库
let config = null;      // 别名 = db
let cart = {};          // ci_ii -> qty
let selDate = '', selTime = '';

// ---------- 登录 ----------
async function login(){
  const phone = $('phoneInput').value.trim();
  if(!/^1\d{10}$/.test(phone)) return toast('请输入 11 位手机号');
  me = { phone, role: phone === ADMIN_PHONE ? 'admin' : 'customer' };
  localStorage.setItem('pp_phone', phone);
  await enterApp();
}
function logout(){ localStorage.removeItem('pp_phone'); location.reload(); }
async function enterApp(){
  $('loginView').classList.add('hidden');
  $('mainView').classList.remove('hidden');
  $('whoami').textContent = (me.role==='admin'?'👨‍🍳 管理员':'🧑 顾客') + ' · ' + me.phone.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2');
  if(me.role==='admin') $('adminTab').classList.remove('hidden');
  db = await loadDB(); config = db;
  $('shopName').textContent = config.shopName;
  $('subtitle').textContent = config.subtitle;
  $('notice').textContent = config.notice;
  $('noticeInput').value = config.notice;
  renderMenu(); renderChips(); renderAdmin();
}
function switchTab(t){
  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on', e.dataset.tab===t));
  $('orderPane').classList.toggle('hidden', t!=='order');
  $('myordersPane').classList.toggle('hidden', t!=='myorders');
  $('adminPane').classList.toggle('hidden', t!=='admin');
  if(t==='myorders') loadMyOrders();
  if(t==='admin') renderAdmin();
}
function scrollToOrder(){ window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'}); }

// ---------- 顾客：菜单 ----------
function renderMenu(){
  const c = $('menuCard'); c.innerHTML = '<h2>今日菜单</h2>';
  config.categories.forEach((cat,ci)=>{
    const t = document.createElement('div'); t.className='cat-title'; t.textContent=cat.name; c.appendChild(t);
    cat.items.forEach((it,ii)=>{
      const key = ci+'_'+ii, qty = cart[key]||0;
      const row = document.createElement('div'); row.className='item';
      row.innerHTML = `<div class="name">${it.name}</div><div class="price">¥${it.price}</div>
        <div class="stepper">
          <button onclick="chQty('${key}',-1)">−</button>
          <span class="qty" id="q_${key}">${qty}</span>
          <button onclick="chQty('${key}',1)">＋</button>
        </div>`;
      c.appendChild(row);
    });
  });
  updateCart();
}
function chQty(key, d){
  cart[key] = Math.max(0,(cart[key]||0)+d);
  $('q_'+key).textContent = cart[key];
  updateCart();
}
function cartItems(){
  const items=[];
  config.categories.forEach((cat,ci)=>cat.items.forEach((it,ii)=>{
    const q = cart[ci+'_'+ii]||0;
    if(q>0) items.push({name:it.name, price:it.price, qty:q, cat:cat.name});
  }));
  return items;
}
function updateCart(){
  const items = cartItems();
  $('cartCount').textContent = '已选 '+items.reduce((s,i)=>s+i.qty,0)+' 份';
  $('cartTotal').textContent = '¥'+items.reduce((s,i)=>s+i.price*i.qty,0);
}
function renderChips(){
  const dc = $('dateChips'); dc.innerHTML='';
  (config.dates||[]).forEach(d=>{
    const s = document.createElement('div'); s.className='chip'+(selDate===d?' on':''); s.textContent=d;
    s.onclick=()=>{selDate=d; renderChips();}; dc.appendChild(s);
  });
  if(!config.dates||!config.dates.length) dc.innerHTML='<span class="muted">店主暂未设置可选日期</span>';
  const tc = $('timeChips'); tc.innerHTML='';
  (config.times||[]).forEach(t=>{
    const s = document.createElement('div'); s.className='chip'+(selTime===t?' on':''); s.textContent=t;
    s.onclick=()=>{selTime=t; renderChips();}; tc.appendChild(s);
  });
  if(!config.times||!config.times.length) tc.innerHTML='<span class="muted">店主暂未设置可选时间</span>';
}
async function submitOrder(){
  const items = cartItems();
  if(!items.length) return toast('请先选择菜品');
  if(!selDate) return toast('请选择送货日期');
  if(!selTime) return toast('请选择送货时间');
  const address = $('addrInput').value.trim();
  if(!address) return toast('请填写送货地址');
  const order = {
    id: Date.now(),
    phone: me.phone,
    items,
    total: items.reduce((s,i)=>s+i.price*i.qty,0),
    date: selDate, time: selTime,
    address, note: $('noteInput').value.trim(),
    status: '新订单',
    createdAt: new Date().toLocaleString('zh-CN', { timeZone:'Asia/Shanghai' })
  };
  const d = await loadDB();
  d.orders.unshift(order);
  await saveDB(d);
  db = d; config = d;
  toast('✅ 下单成功！店主会尽快处理');
  cart={}; selDate=''; selTime='';
  $('addrInput').value=''; $('noteInput').value='';
  renderMenu(); renderChips();
}

// ---------- 顾客：我的订单 ----------
function loadMyOrders(){
  const mine = (db.orders||[]).filter(o=>o.phone===me.phone);
  $('myOrderList').innerHTML = mine.length ? mine.map(orderHtml).join('') : '<span class="muted">暂无订单</span>';
}
function orderHtml(o){
  return `<div class="order-card">
    <div class="top"><span>${o.date} ${o.time}</span><span class="tag ${o.status==='已完成'?'done':'new'}">${o.status}</span></div>
    <div style="margin:6px 0;">${o.items.map(i=>i.name+'×'+i.qty).join('、')}</div>
    <div class="top"><span class="muted">${o.address}${o.note?(' · 备注:'+o.note):''}</span><b style="color:#d92b2b;">¥${o.total}</b></div>
  </div>`;
}

// ---------- 管理员 ----------
function renderAdmin(){
  if(me.role!=='admin') return;
  const am = $('adminMenu'); am.innerHTML='';
  config.categories.forEach((cat,ci)=>{
    const t = document.createElement('div'); t.className='cat-title'; t.textContent=cat.name;
    t.title='点击修改分类名'; t.style.cursor='pointer';
    t.onclick=()=>{ const n=prompt('修改分类名',cat.name); if(n){cat.name=n; renderAdmin();} };
    am.appendChild(t);
    cat.items.forEach((it,ii)=>{
      const row = document.createElement('div'); row.className='admin-row';
      row.innerHTML = `<input class="input" value="${it.name}" onchange="config.categories[${ci}].items[${ii}].name=this.value">
        <input class="input" type="number" min="0" value="${it.price}" style="max-width:90px;" onchange="config.categories[${ci}].items[${ii}].price=+this.value||0">
        <span class="del" onclick="delItem(${ci},${ii})">×</span>`;
      am.appendChild(row);
    });
  });
  $('newCatSel').innerHTML = config.categories.map((c,i)=>`<option value="${i}">${c.name}</option>`).join('')
    + `<option value="new">＋ 新分类</option>`;
  $('adminDates').innerHTML = (config.dates||[]).map(d=>`<div class="chip on">${d}<span class="del" onclick="delArr('dates','${d}')">×</span></div>`).join('') || '<span class="muted">暂无日期</span>';
  $('adminTimes').innerHTML = (config.times||[]).map(t=>`<div class="chip on">${t}<span class="del" onclick="delArr('times','${t}')">×</span></div>`).join('') || '<span class="muted">暂无时段</span>';
  const ao = $('adminOrders');
  if(!db.orders || !db.orders.length){ ao.innerHTML='<span class="muted">暂无订单</span>'; return; }
  ao.innerHTML = db.orders.map(o=>`<div class="order-card">
    <div class="top"><span>${o.date} ${o.time} · ${o.phone.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2')}</span>
      <span class="tag ${o.status==='已完成'?'done':'new'}">${o.status}</span></div>
    <div style="margin:6px 0;">${o.items.map(i=>i.name+'×'+i.qty).join('、')}</div>
    <div class="top"><span class="muted">${o.address}${o.note?(' · 备注:'+o.note):''}</span><b style="color:#d92b2b;">¥${o.total}</b></div>
    <div style="margin-top:8px;">
      ${o.status==='新订单'
        ? `<button class="btn small" onclick="setStatus(${o.id},'已完成')">标记完成</button>`
        : `<button class="btn small ghost" onclick="setStatus(${o.id},'新订单')">恢复新单</button>`}
    </div>
  </div>`).join('');
}
function delItem(ci,ii){ config.categories[ci].items.splice(ii,1); renderAdmin(); }
function addItem(){
  const ni=$('newItemName').value.trim(), np=+$('newItemPrice').value;
  if(!ni||!(np>=0)) return toast('请填写菜品名和价格');
  let sel=$('newCatSel').value;
  if(sel==='new'){ const n=prompt('新分类名称'); if(!n) return; config.categories.push({name:n,items:[]}); sel=config.categories.length-1; }
  config.categories[+sel].items.push({name:ni,price:np});
  $('newItemName').value=''; $('newItemPrice').value='';
  renderAdmin();
}
function delArr(key,val){ config[key]=config[key].filter(x=>x!==val); renderAdmin(); }
function addDate(){
  const d=$('newDate').value; if(!d) return toast('请选择日期');
  if(!config.dates.includes(d)) config.dates.push(d);
  config.dates.sort(); $('newDate').value=''; renderAdmin();
}
function genNext7(){
  const out=[];
  for(let i=1;i<=7;i++){ const d=new Date(); d.setDate(d.getDate()+i);
    out.push(d.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit',weekday:'short'})); }
  config.dates = Array.from(new Set([...(config.dates||[]), ...out]));
  renderAdmin();
}
function addTime(){
  const t=$('newTime').value.trim(); if(!t) return toast('请填写时段');
  if(!config.times.includes(t)) config.times.push(t);
  $('newTime').value=''; renderAdmin();
}
async function saveNotice(){
  config.notice = $('noticeInput').value.trim() || config.notice;
  $('notice').textContent = config.notice;
  await commitConfig();
}
async function commitConfig(){
  const d = await loadDB();
  d.categories = config.categories; d.dates = config.dates; d.times = config.times; d.notice = config.notice;
  await saveDB(d);
  db = d; config = d;
}
async function saveConfig(){
  await commitConfig();
  toast('✅ 设置已保存，顾客端即时生效');
  renderChips(); renderAdmin();
}
async function setStatus(id, status){
  const d = await loadDB();
  const o = d.orders.find(x=>x.id===id);
  if(o){ o.status = status; await saveDB(d); db=d; config=d; renderAdmin(); }
}

// 自动登录
(async function init(){
  const p = localStorage.getItem('pp_phone');
  if(p && /^1\d{10}$/.test(p)){
    me = { phone:p, role: p===ADMIN_PHONE?'admin':'customer' };
    await enterApp();
  }
})();
</script>
